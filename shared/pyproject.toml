[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soas-shared"
version = "0.1.0"
description = "Shared schemas and constants for SOC on a Stick"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.5.0",
    "python-dateutil>=2.8.0",
]

[tool.setuptools.packages.find]
where = ["src"]
