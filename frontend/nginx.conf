# Frontend nginx — serves the built React SPA over HTTPS with required client cert.
# Only the proxy container (which presents a SOAS-CA-signed client cert) can reach
# this. SPA assets are static; auth happens between the browser and the proxy/backend.

server {
    listen 3000 ssl;
    server_name frontend;

    ssl_certificate     /run/mtls/frontend/server.crt;
    ssl_certificate_key /run/mtls/frontend/server.key;

    # Require the peer to present a cert signed by the SOAS internal CA.
    ssl_client_certificate /run/mtls/ca/ca.crt;
    ssl_verify_client      on;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — every unknown route returns the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache built assets aggressively; vite emits content-hashed names.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
