apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: soas
resources:
  - ../../pki
  - ../../base
  - ../../istio

# Dev overlay: 1 replica per deployment, debug logs.
patches:
  - target:
      kind: Deployment
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
