---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: worker
  namespace: soas
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: soas
  labels:
    app: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      serviceAccountName: worker
      containers:
        - name: worker
          image: soas-worker:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: backend-db
                  key: url-sync
            - name: REDIS_URL
              value: redis://redis:6379/0
            - name: CELERY_BROKER_URL
              value: redis://redis:6379/0
            - name: CELERY_RESULT_BACKEND
              value: redis://redis:6379/1
            - name: SOAS_API_URL
              value: http://backend:8000/api/v1
            - name: SOAS_AGENT_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: SOAS_AGENT_ROLE
              value: worker
            - name: SOAS_VERSION
              value: "0.1.0"
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
