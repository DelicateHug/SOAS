---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend
  namespace: soas
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: soas
  labels:
    app: frontend
spec:
  selector:
    app: frontend
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      appProtocol: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: soas
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      serviceAccountName: frontend
      containers:
        - name: frontend
          image: soas-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
