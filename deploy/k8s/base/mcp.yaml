---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp
  namespace: soas
---
apiVersion: v1
kind: Service
metadata:
  name: mcp
  namespace: soas
  labels:
    app: mcp
spec:
  selector:
    app: mcp
  ports:
    - name: http
      port: 8765
      targetPort: 8765
      appProtocol: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp
  namespace: soas
  labels:
    app: mcp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mcp
  template:
    metadata:
      labels:
        app: mcp
    spec:
      serviceAccountName: mcp
      containers:
        - name: mcp
          image: soas-mcp:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8765
              name: http
          env:
            - name: SOAS_API_URL
              value: http://backend:8000/api/v1
            - name: EMBEDDING_SERVICE_URL
              value: http://embeddings:8200
            - name: SOAS_TOKEN_FILE
              value: /run/secrets/mcp_token
            - name: MCP_HTTP_PORT
              value: "8765"
            - name: SOAS_AGENT_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: SOAS_AGENT_ROLE
              value: mcp
            - name: SOAS_VERSION
              value: "0.1.0"
          volumeMounts:
            - name: mcp-token
              mountPath: /run/secrets
              readOnly: true
      volumes:
        - name: mcp-token
          secret:
            secretName: mcp-token
