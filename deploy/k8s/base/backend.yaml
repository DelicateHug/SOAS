---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend
  namespace: soas
---
# RBAC: backend may create CertificateRequest resources in its own
# namespace so cert-manager signs the user .p12s. Scope is namespace
# only — no cluster-wide grants.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backend-cert-requester
  namespace: soas
rules:
  - apiGroups: ["cert-manager.io"]
    resources: ["certificaterequests"]
    verbs: ["create", "get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backend-cert-requester
  namespace: soas
subjects:
  - kind: ServiceAccount
    name: backend
    namespace: soas
roleRef:
  kind: Role
  name: backend-cert-requester
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: soas
  labels:
    app: backend
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      appProtocol: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: soas
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      serviceAccountName: backend
      containers:
        - name: backend
          image: soas-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: backend-db
                  key: url
            - name: REDIS_URL
              value: redis://redis:6379/0
            - name: CELERY_BROKER_URL
              value: redis://redis:6379/0
            - name: CELERY_RESULT_BACKEND
              value: redis://redis:6379/1
            - name: SOAS_AGENT_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: SOAS_AGENT_ROLE
              value: backend
            - name: SOAS_VERSION
              value: "0.1.0"
            - name: SOAS_NAMESPACE
              value: soas
            # Honor X-Forwarded-Client-Cert from the Istio gateway
            - name: SOAS_TRUST_XFCC
              value: "true"
            # Pull user certs from cert-manager rather than the dev local CA
            - name: SOAS_CA_MODE
              value: "k8s"
            - name: WEBAUTHN_ORIGIN
              value: "https://soas.example.com"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
