---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: embeddings
  namespace: soas
---
apiVersion: v1
kind: Service
metadata:
  name: embeddings
  namespace: soas
  labels:
    app: embeddings
spec:
  selector:
    app: embeddings
  ports:
    - name: http
      port: 8200
      targetPort: 8200
      appProtocol: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: embeddings
  namespace: soas
  labels:
    app: embeddings
spec:
  replicas: 1
  selector:
    matchLabels:
      app: embeddings
  template:
    metadata:
      labels:
        app: embeddings
    spec:
      serviceAccountName: embeddings
      containers:
        - name: embeddings
          image: soas-embeddings:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8200
              name: http
          env:
            - name: SOAS_API_URL
              value: http://backend:8000/api/v1
            - name: SOAS_AGENT_ID
              value: embeddings_001
            - name: SOAS_AGENT_ROLE
              value: embeddings
            - name: SOAS_VERSION
              value: "0.1.0"
          resources:
            requests:
              cpu: "200m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "3Gi"
