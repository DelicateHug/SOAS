[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "visualpython2"
version = "2.0.0"
description = "Web-based visual Python scripting engine for SOC on a Stick"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "redis>=5.0.0",
    "psycopg[binary]>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/visualpython2"]
