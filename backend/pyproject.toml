[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soas-backend"
version = "0.1.0"
description = "SOC on a Stick - Backend API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pydantic[email]>=2.5.0",
    "python-jose[cryptography]>=3.3.0",
    "argon2-cffi>=23.1.0",
    "webauthn>=2.0.0",
    "pyotp>=2.9.0",
    "qrcode[pil]>=7.4.0",
    "celery[redis]>=5.4.0",
    "redis>=5.0.0",
    "python-multipart>=0.0.9",
    "croniter>=2.0.0",
    "soas-shared",
    "mistune>=3.0.0",
    "cryptography>=42.0.0",
    "httpx>=0.27.0",
    "PyYAML>=6.0",
    "numpy>=1.26.0",
    "anthropic>=0.40.0",
    "weasyprint>=63.0",
    "fastmcp>=2.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
where = ["src"]
