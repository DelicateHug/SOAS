services:
  postgres:
    image: postgres:16-alpine
    container_name: soas-postgres
    environment:
      POSTGRES_DB: soas
      POSTGRES_USER: soas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soas"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: soas-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: soas-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://soas:${POSTGRES_PASSWORD:-changeme}@postgres:5432/soas
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt_private_key
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public_key
      WEBAUTHN_RP_ID: localhost
      WEBAUTHN_RP_NAME: SOC on a Stick
      WEBAUTHN_ORIGIN: http://localhost:3000
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:5173"]'
      USER_SECRET_ENCRYPTION_KEY: ${USER_SECRET_ENCRYPTION_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - automations:/app/automations
      - gitsync:/app/data/git-sync
    secrets:
      - jwt_private_key
      - jwt_public_key

  worker:
    build:
      context: .
      dockerfile: workers/Dockerfile
    container_name: soas-worker
    environment:
      DATABASE_URL: postgresql://soas:${POSTGRES_PASSWORD:-changeme}@postgres:5432/soas
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      AUTOMATIONS_DIR: /app/automations
      SOAS_API_URL: http://backend:8000/api/v1
      USER_SECRET_ENCRYPTION_KEY: ${USER_SECRET_ENCRYPTION_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - automations:/app/automations
      - gitsync:/app/data/git-sync
    command: celery -A soas_workers.celery_app worker --loglevel=info --concurrency=4 -Q celery,compile,execute

  worker-beat:
    build:
      context: .
      dockerfile: workers/Dockerfile
    container_name: soas-worker-beat
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A soas_workers.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    container_name: soas-frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
  automations:
  gitsync:

secrets:
  jwt_private_key:
    file: ./secrets/jwt_private.pem
  jwt_public_key:
    file: ./secrets/jwt_public.pem
