services:
  postgres:
    image: postgres:16-alpine
    container_name: soas-postgres
    environment:
      POSTGRES_DB: soas
      POSTGRES_USER: soas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soas"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: soas-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: soas-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://soas:${POSTGRES_PASSWORD:-changeme}@postgres:5432/soas
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt_private_key
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public_key
      WEBAUTHN_RP_ID: localhost
      WEBAUTHN_RP_NAME: SOC on a Stick
      WEBAUTHN_ORIGIN: http://localhost:3000
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:5173"]'
      USER_SECRET_ENCRYPTION_KEY: ${USER_SECRET_ENCRYPTION_KEY:-}
      EMBEDDING_SERVICE_URL: http://embeddings:8200
      MCP_TOKEN_FILE: /run/mcp/mcp_token
      SOAS_AGENT_ID: backend_001
      SOAS_AGENT_ROLE: backend
      SOAS_VERSION: "0.1.0"
      # AI subprocess: shells out to the `claude` CLI (installed in the image).
      # If ANTHROPIC_API_KEY is set, the CLI uses it directly. Otherwise the analyst
      # must `docker compose exec backend claude` once to log in via OAuth — the
      # session persists in the claude-config named volume.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - automations:/app/automations
      - gitsync:/app/data/git-sync
      - ./wiki:/app/wiki:ro
      - claude_config:/root/.claude
      # The backend writes the MCP token here; the MCP container mounts the same volume
      # read-only and reads it at startup. Sharing a named volume is more portable than
      # the docker-compose `secrets:` block, which only supports static files.
      - mcp_secrets:/run/mcp
    secrets:
      - jwt_private_key
      - jwt_public_key

  worker:
    build:
      context: .
      dockerfile: workers/Dockerfile
    container_name: soas-worker
    environment:
      DATABASE_URL: postgresql://soas:${POSTGRES_PASSWORD:-changeme}@postgres:5432/soas
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      AUTOMATIONS_DIR: /app/automations
      SOAS_API_URL: http://backend:8000/api/v1
      USER_SECRET_ENCRYPTION_KEY: ${USER_SECRET_ENCRYPTION_KEY:-}
      EMBEDDING_SERVICE_URL: http://embeddings:8200
      SOAS_AGENT_ID: worker_001
      SOAS_AGENT_ROLE: worker
      SOAS_VERSION: "0.1.0"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - automations:/app/automations
      - gitsync:/app/data/git-sync
    command: celery -A soas_workers.celery_app worker --loglevel=info --concurrency=4 -Q celery,compile,execute

  worker-beat:
    build:
      context: .
      dockerfile: workers/Dockerfile
    container_name: soas-worker-beat
    environment:
      DATABASE_URL: postgresql://soas:${POSTGRES_PASSWORD:-changeme}@postgres:5432/soas
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      SOAS_AGENT_ID: beat_001
      SOAS_AGENT_ROLE: beat
      SOAS_VERSION: "0.1.0"
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A soas_workers.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    container_name: soas-frontend
    environment:
      VITE_API_URL: http://localhost:8000
      SOAS_AGENT_ID: frontend_001
      SOAS_AGENT_ROLE: frontend
      SOAS_VERSION: "0.1.0"
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # Local embedding service. CPU-only sentence-transformers model baked into the image.
  # Bound only on the internal network — never published to the host. The backend and
  # workers reach it via the docker DNS name `embeddings`.
  embeddings:
    build:
      context: .
      dockerfile: embeddings/Dockerfile
    container_name: soas-embeddings
    environment:
      SENTENCE_MODEL: ${SENTENCE_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      EMBEDDING_MAX_BATCH: "128"
      SOAS_API_URL: http://backend:8000/api/v1
      SOAS_AGENT_ID: embeddings_001
      SOAS_AGENT_ROLE: embeddings
      SOAS_VERSION: "0.1.0"
    healthcheck:
      # Python is guaranteed to be present (slim base); wget isn't.
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8200/health', timeout=3).status == 200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  # MCP server — exposes SOAS as MCP tools to Claude Code / IDEs over streamable HTTP.
  # Reads its bearer token from the shared volume the backend writes at startup.
  mcp:
    build:
      context: .
      dockerfile: mcp/Dockerfile
    container_name: soas-mcp
    environment:
      SOAS_API_URL: http://backend:8000/api/v1
      EMBEDDING_SERVICE_URL: http://embeddings:8200
      SOAS_TOKEN_FILE: /run/secrets/mcp_token
      MCP_HTTP_PORT: "8765"
      # Optional: when set, MCP clients must present this bearer to call the MCP server
      # itself. Leave unset for the default Docker-network-only deployment.
      MCP_SERVER_TOKEN: ${MCP_SERVER_TOKEN:-}
      SOAS_AGENT_ID: mcp_001
      SOAS_AGENT_ROLE: mcp
      SOAS_VERSION: "0.1.0"
    ports:
      - "8765:8765"
    depends_on:
      backend:
        condition: service_started
      embeddings:
        condition: service_healthy
    volumes:
      # Read-only view of the same volume the backend wrote the token to.
      - mcp_secrets:/run/secrets:ro
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  automations:
  gitsync:
  mcp_secrets:
  claude_config:

secrets:
  jwt_private_key:
    file: ./secrets/jwt_private.pem
  jwt_public_key:
    file: ./secrets/jwt_public.pem
